# Open file:// hyperlinks clicked in the terminal with $EDITOR.
# Used mainly for paths emitted by coding agents (e.g. pi tool cards in
# fullscreen mode): ctrl+shift+click opens the file in an overlay window on
# top of the agent; when the editor exits, the overlay closes and you are
# back where you were.

# Text files detected by mime type
protocol file
mime text/*
action launch --type=overlay -- $EDITOR -- $FILE_PATH

# Source/config extensions that may not map to a text/* mime
protocol file
ext ts,tsx,js,jsx,mjs,cjs,json,yaml,yml,toml,lua,py,rb,go,rs,java,kt,swift,c,h,cpp,hpp,cs,php,sh,zsh,fish,bash,sql,html,css,scss,vue,svelte,md,gitignore,dockerfile
action launch --type=overlay -- $EDITOR -- $FILE_PATH

# Directories: leave to the OS default handler
# (no rule -> falls through to macOS open / Linux xdg-open)
